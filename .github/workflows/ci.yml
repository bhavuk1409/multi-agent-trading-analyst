name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python tests ────────────────────────────────────────────────────────────
  test-python:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Run offline tests (no API keys required)
        run: python -m pytest tests/test_rl_env.py -v --tb=short

      - name: Run data handler tests
        # These need network access to Yahoo Finance (free, no key)
        run: python -m pytest tests/test_data_handler.py -v --tb=short

      - name: Run multi-agent integration tests
        # Skipped automatically when GROQ_API_KEY is not set
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m pytest tests/test_multi_agent_system.py -v --tb=short

  # ── TypeScript type-check ───────────────────────────────────────────────────
  test-typescript:
    name: TypeScript type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: TypeScript compile check
        run: cd frontend && npx tsc --noEmit

  # ── RL weight validation ────────────────────────────────────────────────────
  validate-rl-weights:
    name: Validate RL inference weights
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Smoke-test pure-numpy RL agent (no torch)
        run: |
          python src/rl_agent.py
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from rl_agent import get_rl_trader_agent
          agent = get_rl_trader_agent()
          assert agent._ready, 'RL agent not ready'
          assert 'torch' not in sys.modules, 'torch was imported at inference time'
          print('✓ RL agent ready, torch not imported')
          "
