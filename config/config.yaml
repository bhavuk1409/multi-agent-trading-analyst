# NEXUS — Multi-Agent Trading Analyst: Configuration
# =====================================================
# All date ranges are overridden at runtime by api_server.py (uses today's date).
# Edit this file to change the LLM model or agent weights.

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  tickers: ["AAPL", "GOOGL", "MSFT", "TSLA", "NVDA"]
  history_days: 90          # calendar days of OHLCV to fetch per analysis request

# ---------------------------------------------------------------------------
# LLM  (Groq — https://console.groq.com)
# ---------------------------------------------------------------------------
llm:
  # Available models on Groq (as of mid-2026):
  #   llama-3.3-70b-versatile   ← recommended (default)
  #   llama-3.1-70b-versatile
  #   llama3-70b-8192
  #   gemma2-9b-it
  model: "llama-3.3-70b-versatile"
  temperature: 0.7
  max_tokens: 2000

# ---------------------------------------------------------------------------
# Multi-Agent weights  (must sum to 1.0)
# Technical + Risk stay at 0.20; Fundamental + Sentiment get +0.025 each
# from the 0.05 freed by pricing the RL trader below the equal-split rate.
# ---------------------------------------------------------------------------
agents:
  technical_analyst:
    enabled: true
    weight: 0.20
  fundamental_analyst:
    enabled: true
    weight: 0.225
  sentiment_analyst:
    enabled: true
    weight: 0.225
  risk_manager:
    enabled: true
    weight: 0.20
  rl_trader:
    enabled: true
    weight: 0.15    # lower weight — stronger at downtrend avoidance than uptrend capture
